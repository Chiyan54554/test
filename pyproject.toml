[project]
name = "chinese-kda-llm"
version = "0.1.0"
description = "A compact Chinese Kimi Delta Attention language model"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "sentencepiece>=0.2",
    "torch>=2.2",
]

[project.scripts]
kda-self-test = "kda_llm.model:main"
kda-build-tokenizer = "kda_llm.cli.build_tokenizer:main"
kda-download-hf = "kda_llm.cli.download_hf_data:main"
kda-prepare-data = "kda_llm.cli.prepare_data:main"
kda-train = "kda_llm.cli.train:main"
kda-convert-traditional = "kda_llm.cli.convert_traditional:main"
kda-pipeline = "kda_llm.cli.pipeline:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kda_llm"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[project.optional-dependencies]
cuda = [
    "flash-linear-attention>=0.5.0",
]
data = [
    "datasets>=3.0.0",
    "zstandard>=0.23.0",
]
traditional = [
    "opencc-python-reimplemented>=0.1.7",
]
